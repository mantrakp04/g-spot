name: CLI npm publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/cli/package.json"
      - "apps/cli/src/**"
      - "apps/cli/scripts/**"
      - "apps/cli/README.md"
      - "apps/web/**"
      - "apps/server/**"
      - "packages/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/cli-npm-publish.yml"
    tags:
      - "cli-v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: cli-npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish g-spot-cli
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun check-types

      - name: Build CLI package
        run: bun run build:cli

      - name: Read CLI package version
        id: package
        working-directory: apps/cli
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check npm version
        id: npm
        run: |
          if npm view "g-spot-cli@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm.outputs.exists == 'false'
        working-directory: apps/cli
        run: npm publish --access public --provenance
