name: Hexclave Config Sync

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "./stack.config.ts"
      - ".github/workflows/hexclave-config-sync.yml"

jobs:
  push-hexclave-config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Push Hexclave config
        env:
          # The Hexclave CLI still reads the STACK_* env var names for auth.
          STACK_PROJECT_ID: ${{ secrets.STACK_AUTH_PROJECT_ID }}
          STACK_SECRET_SERVER_KEY: ${{ secrets.STACK_AUTH_SECRET_SERVER_KEY }}
          HEXCLAVE_CONFIG_PATH: "./stack.config.ts"
        run: npx -y -p @hexclave/cli@latest hexclave config push --config-file "$HEXCLAVE_CONFIG_PATH"
