name: Stack Auth Config Sync

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "./stack.config.ts"
      - ".github/workflows/stack-auth-config-sync.yml"

jobs:
  push-stack-config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Push Stack Auth config
        env:
          STACK_PROJECT_ID: ${{ secrets.STACK_AUTH_PROJECT_ID }}
          STACK_SECRET_SERVER_KEY: ${{ secrets.STACK_AUTH_SECRET_SERVER_KEY }}
          STACK_AUTH_CONFIG_PATH: "./stack.config.ts"
        run: npx -y @stackframe/stack-cli@latest config push --config-file "$STACK_AUTH_CONFIG_PATH"
