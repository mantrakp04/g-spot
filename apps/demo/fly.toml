app = "g-spot-demo"
primary_region = "sjc"

[build]
  dockerfile = "../../apps/demo/Dockerfile"

[env]
  NODE_ENV = "production"
  DEMO_MODE = "true"
  VITE_DEMO_MODE = "true"
  VITE_SERVER_URL = "/"
  SERVER_HOST = "0.0.0.0"
  SERVER_PORT = "3000"
  G_SPOT_WEB_DIST_DIR = "/app/apps/web/dist"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"
